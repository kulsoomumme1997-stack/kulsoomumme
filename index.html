<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A1 Täglich</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1d4ed8">
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1a1a1a;--mute:#666;--acc:#1d4ed8;--ok:#15803d;--bad:#b91c1c;--line:#e5e5e0}
@media (prefers-color-scheme:dark){:root{--bg:#111214;--card:#1b1d20;--ink:#eee;--mute:#999;--acc:#6ea0ff;--ok:#4ade80;--bad:#f87171;--line:#2c2f33}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0}h2{font-size:19px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.space{justify-content:space-between}
button{font:inherit;padding:11px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}button.opt{display:block;width:100%;text-align:left;margin:6px 0}
button.ok{border-color:var(--ok);color:var(--ok)}button.no{border-color:var(--bad);color:var(--bad)}
.mute{color:var(--mute);font-size:15px}.big{font-size:30px;font-weight:600;margin:8px 0}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
textarea{width:100%;min-height:120px;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.step{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:6px 0;display:flex;justify-content:space-between}
.done{opacity:.55}
.en{display:none;color:var(--mute);font-size:15px;margin:6px 0}.showen .en{display:block}
.chip{margin:4px 4px 4px 0}.bubble{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}.ans{min-height:48px;border:1px dashed var(--line);border-radius:10px;padding:6px;margin:8px 0}
.passage{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
</style>
</head>
<body><main id="app"></main>
<script src="content.js"></script>
<script>
const KEY="a1-taeglich-v1", $=s=>document.querySelector(s), app=$("#app");
const dayNum=()=>{const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)};
const INTERVALS=[0,1,2,4,8,16,32]; // days per Leitner box
let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s){if(s.lessons&&s.lessons["01"]&&!s.mig2){s.lessons["05"]=s.lessons["01"];delete s.lessons["01"]}s.mig2=1;return s}}catch(e){}
  return {cards:{},seen:0,days:[],sessions:0,notes:{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function say(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=.85;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith("de"));if(v)u.voice=v;speechSynthesis.speak(u)}
function streak(){let n=0,d=dayNum();if(!S.days.includes(d))d--;while(S.days.includes(d)){n++;d--}return n}

function exportData(){
  const blob=new Blob([JSON.stringify({app:KEY,saved:new Date().toISOString(),data:S})],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="a1-taeglich-backup-"+new Date().toISOString().slice(0,10)+".json";
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  $("#bmsg").textContent="Backup saved to your downloads.";
}
function importData(f){
  if(!f)return;const r=new FileReader();
  r.onload=()=>{try{
    const j=JSON.parse(r.result);
    if(j.app!==KEY||!j.data||typeof j.data.cards!=="object"||!Array.isArray(j.data.days))throw 0;
    S=j.data;save();home();$("#bmsg").textContent="Backup restored: "+S.sessions+" sessions, "+Object.keys(S.cards).length+" words.";
  }catch(e){$("#bmsg").textContent="That file is not an A1 Täglich backup."}};
  r.readAsText(f);
}
// ---- today's plan ----
let plan=null, cur=0, started=0;
const BLOCKS=[
 {name:"Review words",min:5,run:reviewBlock},
 {name:"New words",min:4,run:newWordsBlock},
 {name:"Grammar",min:5,run:grammarBlock},
 {name:"Lesen (reading)",min:4,run:readBlock},
 {name:"Hören (listening)",min:3,run:listenBlock},
 {name:"Alltag (daily life)",min:5,run:alltagBlock},
 {name:"Schreiben / Sprechen",min:4,run:produceBlock}
];
function home(){
  const done=S.days.includes(dayNum()), due=dueCards().length;
  app.innerHTML=`<h1>A1 Täglich</h1>
  <div class="card"><div class="row space"><div><b>${streak()}</b> day streak 🔥</div><div class="mute">${Object.keys(S.cards).length}/${CONTENT.vocab.length} words started · ${due} due</div></div>
  <div class="bar" style="margin-top:10px"><i style="width:${Math.min(100,S.sessions/30*100)}%"></i></div><div class="mute">${S.sessions} of 30 sessions</div></div>
  <div class="card"><h2>Today · 30 min</h2>${BLOCKS.map(b=>`<div class="step"><span>${b.name}</span><span class="mute">${b.min} min</span></div>`).join("")}
  <p class="mute">${done?"✅ Already done today. Doing it again is fine, but sleep matters more than extra reps.":""}</p>
  <button class="p" onclick="start()">${done?"Practise again":"Start today's session"}</button></div>
  <div class="card"><b>Lektionen</b><p class="mute">Short guided lessons from the Deutsch Daily course. Do them in order.</p>
  ${CONTENT.lessons.map(l=>`<div class="row space" style="padding:8px 0;border-top:1px solid var(--line)"><div><b>${l.id} · ${esc(l.title)}</b><div class="mute">~${l.minutes} min${S.lessons&&S.lessons[l.id]?" · best "+S.lessons[l.id].best+"%":""}</div></div><button class="p" onclick="startLesson('${l.id}')">${S.lessons&&S.lessons[l.id]?"Repeat":"Start"}</button></div>`).join("")}</div>
  <div class="card"><b>Extra practice</b><p class="mute">Optional drills, any time. They use words you have already met.</p>
  <div class="row"><button onclick="extra('write')">Write the word</button><button onclick="extra('hear')">Listen &amp; type</button><button onclick="extra('artikel')">der / die / das</button><button onclick="extra('szene')">Daily scenes</button></div></div>
  <div class="card"><b>Exam</b><p class="mute">${CONTENT.examInfo}</p></div>
  <div class="card"><b>Mistake bank</b><p class="mute">${(S.mistakes||[]).length} saved mistakes from lessons.</p><button onclick="showMistakes()">Review mistakes</button></div>
  <div class="card"><b>Backup</b><p class="mute">Your progress lives only on this device. Save a backup file now and then, and import it on a new phone.</p>
  <div class="row"><button onclick="exportData()">Export backup</button><button onclick="document.getElementById('imp').click()">Import backup</button>
  <input id="imp" type="file" accept="application/json,.json" hidden onchange="importData(this.files[0])"></div><p id="bmsg" class="mute"></p></div>
  <button onclick="if(confirm('Reset all progress?')){localStorage.removeItem('${KEY}');S=load();home()}" class="mute">Reset progress</button>`;
}
function start(){cur=0;started=Date.now();S._n={newWords:[]};runBlock()}
function runBlock(){
  if(cur>=BLOCKS.length)return finish();
  const b=BLOCKS[cur];
  app.innerHTML=`<div class="row space mute"><span>${cur+1}/${BLOCKS.length} · ${b.name} (~${b.min} min)</span><span id="clk"></span></div>
  <div class="bar"><i style="width:${cur/BLOCKS.length*100}%"></i></div><div id="blk"></div>`;
  tick();b.run($("#blk"),()=>{cur++;runBlock()});
}
function tick(){clearTimeout(tick.t);const c=$("#clk");if(!c)return;
  const s=Math.floor((Date.now()-started)/1000);c.textContent=`⏱ ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;tick.t=setTimeout(tick,1000)}
function finish(){
  const d=dayNum();if(!S.days.includes(d)){S.days.push(d);S.sessions++}
  S.seen=Object.keys(S.cards).length;delete S._n;save();clearTimeout(tick.t);
  const m=Math.round((Date.now()-started)/60000);
  app.innerHTML=`<div class="card"><h2>Fertig! 🎉</h2><p>${m} min today · ${streak()} day streak.</p>
  <p class="mute">Tomorrow: your new words come back for review. That repetition is what makes them stick.</p><button class="p" onclick="home()">Home</button></div>`;
}

// ---- vocab / spaced repetition ----
function dueCards(){const d=dayNum();return Object.entries(S.cards).filter(([k,c])=>c.due<=d).map(([k])=>+k)}
function reviewBlock(el,next){
  const q=dueCards().sort(()=>Math.random()-.5).slice(0,15);
  if(!q.length){el.innerHTML=`<div class="card"><p>No words to review yet. Learn some new ones first.</p><button class="p" id="n">Next</button></div>`;$("#n").onclick=next;return}
  let i=0;(function show(){
    if(i>=q.length){save();return next()}
    const w=CONTENT.vocab[q[i]];
    el.innerHTML=`<div class="card"><div class="mute">${i+1}/${q.length} · What does this mean?</div><div class="big">${esc(w[0])}</div>
    <button onclick="say(${JSON.stringify(w[0]).replace(/"/g,"&quot;")})">🔊</button><div id="a"></div><button class="p" id="r">Show answer</button></div>`;
    $("#r").onclick=()=>{$("#a").innerHTML=`<p><b>${esc(w[1])}</b></p><p class="mute"><i>${esc(w[2])}</i></p>`;
      $("#r").outerHTML=`<div class="row"><button id="no" class="no">Again</button><button id="yes" class="ok">Got it</button></div>`;
      const grade=ok=>{const c=S.cards[q[i]];c.box=ok?Math.min(c.box+1,INTERVALS.length-1):0;c.due=dayNum()+Math.max(INTERVALS[c.box],ok?1:0);i++;show()};
      $("#yes").onclick=()=>grade(true);$("#no").onclick=()=>grade(false)};
  })();
}
function newWordsBlock(el,next){
  const t=theme(),fresh=[],V=CONTENT.vocab;
  V.forEach((w,i)=>{if(fresh.length<4&&!S.cards[i]&&w[3]===t.id)fresh.push(i)});
  V.forEach((w,i)=>{if(fresh.length<6&&!S.cards[i]&&!w[3])fresh.push(i)});
  V.forEach((w,i)=>{if(fresh.length<6&&!S.cards[i]&&!fresh.includes(i))fresh.push(i)});
  if(!fresh.length){el.innerHTML=`<div class="card"><p>You've started every word. Add more to content.js!</p><button class="p" id="n">Next</button></div>`;$("#n").onclick=next;return}
  let i=0;(function show(){
    if(i>=fresh.length){save();return next()}
    const w=CONTENT.vocab[fresh[i]];
    el.innerHTML=`<div class="card"><div class="mute">New word ${i+1}/${fresh.length}${w[3]?" · "+esc(THEMES.find(x=>x.id===w[3]).name):""}</div><div class="big">${esc(w[0])}</div><p><b>${esc(w[1])}</b></p>
    <p class="mute"><i>${esc(w[2])}</i></p><div class="row"><button id="s">🔊 Word</button><button id="s2">🔊 Sentence</button></div>
    <p class="mute">Say it aloud 3 times before continuing.</p><button class="p" id="k">Next</button></div>`;
    $("#s").onclick=()=>say(w[0]);$("#s2").onclick=()=>say(w[2]);
    $("#k").onclick=()=>{S.cards[fresh[i]]={box:1,due:dayNum()+1};i++;show()};
  })();
}

// ---- quiz helper ----
function quiz(el,items,next,title,passage){
  let i=0,score=0;(function show(){
    if(i>=items.length){el.innerHTML=`<div class="card"><h2>${score}/${items.length} correct</h2><p class="mute">${score===items.length?"Perfect.":"Re-read the explanation once, then move on."}</p><button class="p" id="n">Next</button></div>`;return void($("#n").onclick=next)}
    const [q,opts,ans,audio]=items[i];
    el.innerHTML=`<div class="card"><div class="mute">${title} · ${i+1}/${items.length}</div>${audio?`<button id="pl">🔊 Play again</button>`:""}${passage?`<div class="passage">${esc(passage)}</div>`:""}<p class="big" style="font-size:20px">${esc(q)}</p><div id="o"></div></div>`;
    if(audio){$("#pl").onclick=()=>say(audio);say(audio)}
    const fixed=opts[0]==="Richtig"||opts[0]==="A"||opts.length<3&&opts.every(x=>x.length<3);
    const order=opts.map((_,j)=>j);if(!fixed)order.sort(()=>Math.random()-.5);
    order.forEach(j=>{const o=opts[j],b=document.createElement("button");b.className="opt";b.textContent=o;b.dataset.j=j;
      b.onclick=()=>{const bs=el.querySelectorAll(".opt");bs.forEach(x=>{x.disabled=true;if(+x.dataset.j===ans)x.classList.add("ok")});
        if(j===ans)score++;else b.classList.add("no");
        const n=document.createElement("button");n.className="p";n.textContent="Continue";n.onclick=()=>{i++;show()};$("#o").append(n)};
      $("#o").append(b)});
  })();
}
function grammarBlock(el,next){
  const g=CONTENT.grammar[S.sessions%CONTENT.grammar.length];
  el.innerHTML=`<div class="card"><h2>${g.title}</h2><p>${g.text}</p><button class="p" id="go">Practise</button></div>`;
  $("#go").onclick=()=>quiz(el,g.q,next,g.title);
}
function readBlock(el,next){
  const R=CONTENT.reading,t=R[S.sessions%R.length];
  el.innerHTML=`<div class="card"><h2>Lesen: ${esc(t.title)}</h2><p class="mute">${t.type==="tf"?"Read the text. Mark each statement richtig or falsch.":"Read the texts. Choose the correct answer."} No dictionary: guess unknown words from context, as in the exam.</p><button class="p" id="go">Start</button></div>`;
  $("#go").onclick=()=>quiz(el,t.qs,next,"Lesen",t.text);
}
function listenBlock(el,next){
  const L=CONTENT.listening,n=L.length,start=(S.sessions*3)%n;
  const items=[0,1,2].map(k=>L[(start+k)%n]).map(([t,q,o,a])=>[q,o,a,t]);
  el.innerHTML=`<div class="card"><h2>Hören</h2><p class="mute">Listen first, then answer. In the real exam you hear each text twice. If you hear nothing, your device has no German voice — turn on sound / install a German voice.</p><button class="p" id="go">Start</button></div>`;
  $("#go").onclick=()=>quiz(el,items,next,"Hören");
}
// ---- daily-life exercises ----
const THEMES=CONTENT.themes, theme=()=>THEMES[S.sessions%THEMES.length];
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const norm=t=>t.toLowerCase().trim().replace(/[.!?,;]+$/,"").replace(/\s+/g," ").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");
function pickIdx(n,tid){
  const V=CONTENT.vocab,seen=Object.keys(S.cards).map(Number);
  let a=tid?shuffle(seen.filter(i=>V[i][3]===tid)).slice(0,n):[];
  if(a.length<n)a=a.concat(shuffle(seen.filter(i=>!a.includes(i))).slice(0,n-a.length));
  if(a.length<n)a=a.concat(shuffle(V.map((_,i)=>i).filter(i=>!a.includes(i))).slice(0,n-a.length));
  return a;
}
function articleItems(n){
  const V=CONTENT.vocab,isN=i=>/^(der|die|das) /.test(V[i][0]),seen=Object.keys(S.cards).map(Number).filter(isN);
  let a=shuffle(seen).slice(0,n);
  if(a.length<n)a=a.concat(shuffle(V.map((_,i)=>i).filter(i=>isN(i)&&!a.includes(i))).slice(0,n-a.length));
  return a.map(i=>{const [art,...rest]=V[i][0].split(" ");return [`___ ${rest.join(" ")}  (${V[i][1]})`,["der","die","das"],["der","die","das"].indexOf(art)]});
}
function sceneItems(d){return d.steps.map(([q,o])=>{const s=shuffle(o.map((t,j)=>[t,j===0]));return [q,s.map(x=>x[0]),s.findIndex(x=>x[1]),q]})}
function typeEx(el,idxs,next,title,hear){
  let i=0,score=0;(function show(){
    if(i>=idxs.length){el.innerHTML=`<div class="card"><h2>${score}/${idxs.length} correct</h2><p class="mute">${score===idxs.length?"Perfekt.":"Wrong words come back sooner in your reviews."}</p><button class="p" id="n">Next</button></div>`;return void($("#n").onclick=next)}
    const w=CONTENT.vocab[idxs[i]];
    el.innerHTML=`<div class="card"><div class="mute">${title} · ${i+1}/${idxs.length}</div>
    <p class="mute">${hear?"Listen and type what you hear (with der/die/das for nouns).":"Write it in German (with der/die/das for nouns)."}</p>
    ${hear?`<button id="pl">🔊 Play again</button>`:`<div class="big">${esc(w[1])}</div>`}
    <input id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:100%;font:inherit;padding:10px;margin:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)">
    <div class="row">${["ä","ö","ü","ß"].map(c=>`<button type="button" class="um">${c}</button>`).join("")}</div><div id="fb" style="margin:10px 0"></div><button class="p" id="ck">Check</button></div>`;
    const inp=$("#ti");inp.focus();
    if(hear){$("#pl").onclick=()=>say(w[0]);say(w[0])}
    el.querySelectorAll(".um").forEach(b=>b.onclick=()=>{const a=inp.selectionStart||inp.value.length;inp.value=inp.value.slice(0,a)+b.textContent+inp.value.slice(a);inp.focus();inp.setSelectionRange(a+1,a+1)});
    let checked=false;const go=()=>{
      if(checked){i++;return show()}checked=true;
      const ok=norm(inp.value)===norm(w[0]);if(ok)score++;
      const c=S.cards[idxs[i]];if(c&&!ok){c.box=0;c.due=dayNum()+1;save()}
      $("#fb").innerHTML=ok?`<b style="color:var(--ok)">Richtig!</b> <span class="mute"><i>${esc(w[2])}</i></span>`:`<b style="color:var(--bad)">Not quite.</b> Correct: <b>${esc(w[0])}</b> <span class="mute"><i>${esc(w[2])}</i></span>`;
      $("#ck").textContent="Continue";if(!hear)say(w[0]);
    };
    $("#ck").onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go()};
  })();
}
function alltagBlock(el,next){
  const t=theme(),d=CONTENT.dialogues.find(x=>x.theme===t.id);
  el.innerHTML=`<div class="card"><h2>Alltag: ${esc(t.name)}</h2><p class="mute">Today's real-life situation. You will write words, check articles, then answer in a short scene: ${esc(d.scene)}.</p><button class="p" id="go">Start</button></div>`;
  $("#go").onclick=()=>typeEx(el,pickIdx(5,t.id),()=>quiz(el,articleItems(4),()=>quiz(el,sceneItems(d),next,"Szene: "+d.scene),"Artikel"),"Wörter schreiben");
}
function extra(kind){
  app.innerHTML=`<div class="row space"><button onclick="home()">← Home</button></div><div id="blk"></div>`;const el=$("#blk"),back=home;
  if(kind==="write")typeEx(el,pickIdx(10),back,"Wörter schreiben");
  else if(kind==="hear")typeEx(el,pickIdx(8),back,"Hören & schreiben",true);
  else if(kind==="artikel")quiz(el,articleItems(10),back,"Artikel");
  else{const d=shuffle(CONTENT.dialogues)[0];quiz(el,sceneItems(d),back,"Szene: "+d.scene)}
}
function produceBlock(el,next){
  const writing=S.sessions%2===0, list=writing?CONTENT.writing:CONTENT.speaking;
  const p=list[Math.floor(S.sessions/2)%list.length];
  el.innerHTML=`<div class="card"><h2>${writing?"Schreiben ✍️":"Sprechen 🗣️"}</h2><p>${esc(p)}</p>
  ${writing?`<textarea id="t" placeholder="Schreib hier…"></textarea><p class="mute">Check: greeting? sentences start with a capital letter? nouns capitalised? verb in position 2? closing (Viele Grüße)?</p>`
  :`<p class="mute">Say it aloud, standing up if you can. Then once more, faster. Check: complete sentences? verb in position 2? No English words?</p>`}
  <button class="p" id="d">Done</button></div>`;
  $("#d").onclick=()=>{if(writing){const v=$("#t").value.trim();if(v){S.notes[dayNum()]=v;save()}}next()};
}
// ---- guided lessons ----
let LR=null;
function rec(tag,ok,q,given,correct){
  LR.log.push({tag,ok,q,given,correct});
  if(!ok){S.mistakes=S.mistakes||[];S.mistakes.unshift({q,correct,tag,date:dayNum()});S.mistakes=S.mistakes.slice(0,60);save()}
}
function sayAll(lines){
  if(!("speechSynthesis" in window))return;speechSynthesis.cancel();
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith("de"));
  lines.forEach(([who,t,sp])=>{const u=new SpeechSynthesisUtterance(sp||t);u.lang="de-DE";u.rate=.85;u.pitch=who===0?1.25:.8;if(v)u.voice=v;speechSynthesis.speak(u)});
}
function showMistakes(){
  const m=S.mistakes||[];
  app.innerHTML=`<div class="row space"><button onclick="home()">← Home</button>${m.length?`<button onclick="S.mistakes=[];save();showMistakes()">Clear all</button>`:""}</div><h1>Mistake bank</h1>
  ${m.length?m.map(x=>`<div class="card"><div class="mute">${esc(x.q)}</div><div>Richtig: <b>${esc(x.correct)}</b></div></div>`).join(""):`<div class="card"><p class="mute">No mistakes saved yet. Finish a lesson to fill this list.</p></div>`}`;
}
function startLesson(id){
  const L=CONTENT.lessons.find(l=>l.id===id);LR={L,log:[],test:[]};
  const steps=[["Lernziel",lsIntro],["Wortschatz",lsVocab],["Grammatik",lsGrammar],["Hören",lsListen]];
  if(L.reading)steps.push(["Lesen",lsRead]);
  if(L.writing)steps.push(["Schreiben",lsWrite]);
  if(L.docOrder)steps.push(["Sprechen",lsSpeak],["Üben",lsPractice]);else steps.push(["Üben",lsPractice],["Sprechen",lsSpeak]);
  steps.push(["Mini-Test",lsTest],["Feedback",lsFeedback]);
  let k=0;
  app.className="";
  app.innerHTML=`<div class="row space"><button onclick="home()">← Home</button><button id="enb">English</button></div>
  <div class="row space mute" style="margin-top:10px"><span id="lbl"></span></div><div class="bar"><i id="lb" style="width:0"></i></div><div id="blk"></div>`;
  $("#enb").onclick=()=>app.classList.toggle("showen");
  const run=()=>{if(k>=steps.length)return;$("#lb").style.width=k/steps.length*100+"%";$("#lbl").textContent=`Schritt ${k+1}/${steps.length} · ${steps[k][0]}`;window.scrollTo(0,0);steps[k++][1]($("#blk"),run)};
  run();
}
function lsIntro(el,next){
  const L=LR.L;
  el.innerHTML=`<div class="card"><h2>Lektion ${L.id}: ${esc(L.title)}</h2><p><b>Du kannst …</b></p>${L.goals?`<ul>${L.goals.map(g=>`<li>${esc(g)}</li>`).join("")}</ul>`:`<p>${esc(L.goal)}</p>`}<div class="en">${esc(L.goalEn)}</div>
  <p class="mute">${L.level?esc(L.level)+" · ":""}${L.minutes} Minuten</p><button class="p" id="go">Los geht's</button></div>`;
  $("#go").onclick=next;
}
function lsVocab(el,next){
  const L=LR.L;
  el.innerHTML=`<div class="card"><h2>Neue Wörter</h2><p class="mute">Höre jedes Wort und sprich es laut nach.</p>
  ${L.vocab.map((w,i)=>`<div class="row space" style="padding:8px 0;border-top:1px solid var(--line)"><div><b>${esc(w[0])}</b>${w[1]?` <span class="mute">(${esc(w[1])})</span>`:""}${w[4]?`<div class="mute">${esc(w[4])}</div>`:""}<div class="mute"><i>${esc(w[3])}</i></div>${L.docOrder?`<div class="en">${esc(w[2])}</div>`:`<div class="mute">${esc(w[2])}</div>`}</div><button data-i="${i}" class="sp">🔊</button></div>`).join("")}
  <button class="p" id="go" style="margin-top:12px">Weiter</button></div>`;
  el.querySelectorAll(".sp").forEach(b=>b.onclick=()=>{const w=L.vocab[b.dataset.i];say(w[0]+". "+w[3])});
  $("#go").onclick=()=>{
    L.vocab.forEach(w=>{const i=CONTENT.vocab.findIndex(v=>v[0].toLowerCase()===w[0].toLowerCase());if(i>=0&&!S.cards[i])S.cards[i]={box:1,due:dayNum()+1}});save();next()};
}
function lsGrammar(el,next){
  const G=LR.L.grammar;let i=0;
  (function show(){
    if(i>=G.length)return next();
    const g=G[i];
    el.innerHTML=`<div class="card"><div class="mute">Grammatik ${i+1}/${G.length}</div><h2>${esc(g.title)}</h2><p>${g.de}</p><div class="en">${esc(g.en)}</div><button class="p" id="go">Weiter</button></div>`;
    $("#go").onclick=()=>{i++;show()};
  })();
}
function lsListen(el,next){
  const Q=LR.L.listening;
  el.innerHTML=`<div class="card"><h2>Hören</h2><p>Höre das Gespräch von ${esc(Q.names[0])} und ${esc(Q.names[1])}.</p><div class="row"><button id="pl" class="p">🔊 Gespräch abspielen</button><button id="tx">Text zeigen</button></div><div id="tr" class="bubble" hidden>${Q.lines.map(l=>`<div><b>${esc(Q.names[l[0]])}:</b> ${esc(l[1])}</div>`).join("")}</div>
  <p class="mute">Höre es zuerst, ohne den Text. Dann beantworte die Fragen.</p><button class="p" id="go">Zu den Fragen</button></div>`;
  $("#pl").onclick=()=>sayAll(Q.lines);$("#tx").onclick=()=>{$("#tr").hidden=!$("#tr").hidden};
  $("#go").onclick=()=>runItems(el,Q.qs,next,"Hören");
}
function lsPractice(el,next){runItems(el,LR.L.exercises,next,"Üben")}
function lsTest(el,next){
  el.innerHTML=`<div class="card"><h2>Mini-Test</h2><p>5 Fragen. Du siehst die Lösungen erst am Ende.</p><button class="p" id="go">Start</button></div>`;
  $("#go").onclick=()=>runItems(el,LR.L.test,next,"Mini-Test",true);
}
function lsRead(el,next){
  const R=LR.L.reading;
  el.innerHTML=`<div class="card"><h2>Lesen</h2><div class="passage">${esc(R.text)}</div><div class="row"><button id="pl">🔊 Text anhören</button></div><p class="mute">Lies den Text. Dann beantworte die Fragen.</p><button class="p" id="go">Zu den Fragen</button></div>`;
  $("#pl").onclick=()=>say(R.text);$("#go").onclick=()=>runItems(el,R.qs.map(q=>Object.assign({},q,{ctx:R.text})),next,"Lesen");
}
function lsWrite(el,next){
  const L=LR.L;
  el.innerHTML=`<div class="card"><h2>Schreiben ✍️</h2><p>${esc(L.writing)}</p><textarea id="t" placeholder="Schreib hier…"></textarea>
  <p class="mute">Prüfe: Beginnt jeder Satz groß? Steht das Verb auf Position 2? Passen die Verbformen (ich … / du … / er … )?</p><button class="p" id="d">Fertig</button></div>`;
  $("#d").onclick=()=>{const v=$("#t").value.trim();if(v){S.notes=S.notes||{};S.notes["L"+L.id+"-"+dayNum()]=v;save()}next()};
}
function runItems(el,items,done,title,quiet){
  let i=0;
  (function show(){
    if(i>=items.length)return done();
    const it=items[i],adv=()=>{i++;show()};
    el.innerHTML=`<div class="card"><div class="mute">${title} · ${i+1}/${items.length}</div>${it.ctx?`<div class="passage">${esc(it.ctx)}</div>`:""}<p class="big" style="font-size:20px">${esc(it.q)}</p>${it.en?`<div class="en">${esc(it.en)}</div>`:""}<div id="ex"></div><div id="fb" style="margin:10px 0"></div><div id="act"></div></div>`;
    const ex=$("#ex"),fb=$("#fb"),act=$("#act");
    const finish=(ok,given,correct)=>{
      rec(it.tag,ok,it.q+(it.words?" ("+it.words.join(" ")+")":""),given,correct);if(quiet&&title==="Mini-Test")LR.test.push(ok);
      fb.innerHTML=quiet?"":ok?`<b style="color:var(--ok)">Richtig!</b>`:`<b style="color:var(--bad)">Nicht ganz.</b> Richtig: <b>${esc(correct)}</b>`;
      act.innerHTML=`<button class="p" id="nx">Weiter</button>`;$("#nx").onclick=adv;
    };
    if(it.t==="mcq"||it.t==="listen"){
      if(it.t==="listen"){ex.innerHTML=`<button id="pl">🔊 Abspielen</button>`;$("#pl").onclick=()=>say(it.say);say(it.say)}
      const o=shuffle(it.opts.map((t,j)=>[t,j===it.a]));
      const box=document.createElement("div");ex.append(box);
      o.forEach(([t,c])=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.dataset.c=c?"1":"";
        b.onclick=()=>{box.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(!quiet&&x.dataset.c)x.classList.add("ok")});if(!quiet&&!c)b.classList.add("no");finish(c,t,it.opts[it.a])};
        box.append(b)});
    }else if(it.t==="build"){
      let bank=shuffle(it.words.map((w,j)=>({w,j}))),chosen=[];
      const draw=()=>{
        ex.innerHTML=`<div class="ans">${chosen.map(c=>`<button class="chip" data-j="${c.j}" data-s="c">${esc(c.w)}</button>`).join("")}</div><div>${bank.map(c=>`<button class="chip" data-j="${c.j}" data-s="b">${esc(c.w)}</button>`).join("")}</div>`;
        ex.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const j=+b.dataset.j;
          if(b.dataset.s==="b"){const c=bank.find(x=>x.j===j);bank=bank.filter(x=>x.j!==j);chosen.push(c)}else{const c=chosen.find(x=>x.j===j);chosen=chosen.filter(x=>x.j!==j);bank.push(c)}draw()});
      };
      draw();act.innerHTML=`<button class="p" id="ck">Prüfen</button>`;
      $("#ck").onclick=()=>{if(chosen.length<it.words.length)return;const g=chosen.map(c=>c.w).join(" "),c=it.words.join(" ");ex.querySelectorAll(".chip").forEach(b=>b.disabled=true);finish(g===c,g,c+(it.suffix!==undefined?it.suffix:it.q.includes("Frage")?"?":"."))};
    }else if(it.t==="free"){
      ex.innerHTML=`<input id="ti" autocomplete="off" spellcheck="false" style="width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)">`;
      const inp=$("#ti");inp.focus();act.innerHTML=`<button class="p" id="ck">Prüfen</button>`;
      const go=()=>{if(!inp.value.trim())return;inp.disabled=true;finish(new RegExp(it.re).test(norm(inp.value)),inp.value.trim(),it.model)};
      $("#ck").onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go()};
    }else if(it.t==="type"){
      ex.innerHTML=`<input id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)">`;
      const inp=$("#ti");inp.focus();act.innerHTML=`<button class="p" id="ck">Prüfen</button>`;
      const go=()=>{if(!inp.value.trim())return;inp.disabled=true;const ok=it.a.some(a=>norm(a)===norm(inp.value));finish(ok,inp.value.trim(),it.a[0])};
      $("#ck").onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go()};
    }
  })();
}
function lsSpeak(el,next,skip){
  const SP=LR.L.speaking,SR=window.SpeechRecognition||window.webkitSpeechRecognition;let i=0;
  if(SP.task&&!skip){el.innerHTML=`<div class="card"><h2>Sprechen 🗣️</h2><p>${esc(SP.task)}</p><p class="mute">Gleich übst du das mit Lena. Antworte mit ganzen Sätzen.</p><button class="p" id="go">Los</button></div>`;return void($("#go").onclick=()=>lsSpeak(el,next,true))}
  (function show(){
    if(i>=SP.steps.length)return next();
    const st=SP.steps[i];let tried=false;
    el.innerHTML=`<div class="card"><div class="mute">Sprechen ${i+1}/${SP.steps.length} · ${esc(SP.scene)}</div>
    <div class="bubble"><b>Lena:</b> ${esc(st.q)} <button id="rp">🔊</button></div>
    <p class="mute">Antworte mit einem ganzen Satz${SR?" (Mikrofon oder Tastatur)":""}.</p>
    <input id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)">
    <div class="row" style="margin:10px 0">${SR?`<button id="mic">🎤 Sprechen</button>`:""}<button class="p" id="sd">Senden</button></div><div id="fb"></div></div>`;
    say(st.spoken||st.q);$("#rp").onclick=()=>say(st.spoken||st.q);
    if(SR)$("#mic").onclick=()=>{const bad=()=>{$("#fb").innerHTML=`<span class="mute">Mikrofon nicht verfügbar. Bitte tippe deine Antwort.</span>`};try{const r=new SR();r.lang="de-DE";r.interimResults=false;r.onresult=e=>{$("#ti").value=e.results[0][0].transcript};r.onerror=bad;r.start()}catch(e){bad()}};
    const send=()=>{
      const v=$("#ti").value.trim();if(!v)return;
      const ok=new RegExp(st.re).test(norm(v));
      if(!tried){rec(st.tag,ok,"Sprechen: "+st.q,v,st.model);tried=true}
      if(ok){$("#fb").innerHTML=`<b style="color:var(--ok)">Super!</b> ${esc(v)}<br><button class="p" id="nx" style="margin-top:8px">Weiter</button>`;$("#nx").onclick=()=>{i++;show()}}
      else{$("#fb").innerHTML=`<b style="color:var(--bad)">Fast.</b> ${esc(st.tip)}<br>Beispiel: <b>${esc(st.model)}</b> <button id="ms">🔊</button><div class="row" style="margin-top:8px"><button id="rt">Nochmal versuchen</button><button id="nx">Weiter</button></div>`;
        $("#ms").onclick=()=>say(st.model);$("#rt").onclick=()=>{$("#ti").value="";$("#ti").focus();$("#fb").innerHTML=""};$("#nx").onclick=()=>{i++;show()}}
    };
    $("#sd").onclick=send;$("#ti").onkeydown=e=>{if(e.key==="Enter")send()};
  })();
}
function lsFeedback(el){
  const L=LR.L,log=LR.log,tags={},TI=Object.assign({},CONTENT.tagInfoCommon||{},L.tagInfo);
  log.forEach(x=>{(tags[x.tag]=tags[x.tag]||{n:0,ok:0});tags[x.tag].n++;if(x.ok)tags[x.tag].ok++});
  const total=log.length,right=log.filter(x=>x.ok).length,pct=Math.round(right/total*100);
  const tn=LR.test.length,tr=LR.test.filter(Boolean).length,pass=tr>=4&&pct>=70;
  const arr=Object.entries(tags).map(([t,v])=>({t,p:Math.round(v.ok/v.n*100),...v})).sort((a,b)=>a.p-b.p);
  const weak=arr.filter(x=>x.p<80),strong=arr.filter(x=>x.p>=80);
  S.lessons=S.lessons||{};const prev=S.lessons[L.id];
  S.lessons[L.id]={best:Math.max(pct,prev?prev.best:0),last:pct,date:dayNum()};save();
  const miss=log.filter(x=>!x.ok);
  el.innerHTML=`<div class="card"><h2>${pass?"Bestanden! 🎉":"Noch nicht ganz."}</h2><p>Mini-Test: <b>${tr}/${tn}</b> · Gesamt: <b>${pct}%</b>${prev?` <span class="mute">(vorher: ${prev.last}%)</span>`:""}</p>
  <p class="mute">${pass?"Gut gemacht! Wiederhole die Wörter morgen im Review.":"Wiederhole die Lektion morgen. Ziel: mindestens 4/5 im Test."}</p></div>
  <div class="card"><h2>Dein Feedback</h2>
  ${arr.map(x=>`<div style="margin:8px 0"><div class="row space"><span>${esc(TI[x.t].name)}</span><span class="mute">${x.ok}/${x.n}</span></div><div class="bar"><i style="width:${x.p}%"></i></div></div>`).join("")}
  ${strong.length?`<p><b>Stark:</b> ${strong.map(x=>esc(TI[x.t].name)).join(", ")}.</p>`:""}
  ${weak.length?`<p><b>Üben:</b></p>${weak.map(x=>`<p>• <b>${esc(TI[x.t].name)}:</b> ${esc(TI[x.t].tip)}</p>`).join("")}`:`<p>Keine Schwächen gefunden. Weiter so!</p>`}</div>
  ${miss.length?`<div class="card"><h2>Deine Fehler</h2>${miss.map(x=>`<p class="mute">${esc(x.q)}<br>Du: ${esc(x.given)} → Richtig: <b>${esc(x.correct)}</b></p>`).join("")}<p class="mute">Gespeichert in der Fehlerbank.</p></div>`:""}
  ${L.review?`<div class="card"><h2>Wiederholung</h2><p>${esc(L.review)}</p></div>`:""}
  <div class="row"><button class="p" onclick="home()">Fertig</button><button onclick="startLesson('${L.id}')">Lektion wiederholen</button></div>`;
}
if("speechSynthesis" in window)speechSynthesis.getVoices();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
home();
</script>
</body>
