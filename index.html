<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A1 Täglich</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1d4ed8">
<style>
:root{--pfg:#fff;--bg:#f7f7f5;--card:#fff;--ink:#1a1a1a;--mute:#5f5f5f;--acc:#1d4ed8;--ok:#15803d;--bad:#b91c1c;--line:#e5e5e0}
@media (prefers-color-scheme:dark){:root{--pfg:#0b1220;--bg:#111214;--card:#1b1d20;--ink:#eee;--mute:#a3a3a3;--acc:#6ea0ff;--ok:#4ade80;--bad:#f87171;--line:#2c2f33}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0}h2{font-size:19px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.space{justify-content:space-between}
button{font:inherit;padding:11px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.p{background:var(--acc);color:var(--pfg);border-color:var(--acc)}button.opt{display:block;width:100%;text-align:left;margin:6px 0}
button.ok{border-color:var(--ok);color:var(--ok)}button.no{border-color:var(--bad);color:var(--bad)}
.mute{color:var(--mute);font-size:15px}.big{font-size:30px;font-weight:600;margin:8px 0}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
textarea{width:100%;min-height:120px;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.step{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:6px 0;display:flex;justify-content:space-between}
.done{opacity:.55}
.en{display:none;color:var(--mute);font-size:15px;margin:6px 0}.showen .en{display:block}
.chip{margin:4px 4px 4px 0}.bubble{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}.ans{min-height:48px;border:1px dashed var(--line);border-radius:10px;padding:6px;margin:8px 0}
.fbk{border-radius:12px;padding:12px 14px;margin:12px 0;border:1px solid}.fbk.good{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}.fbk.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}.fbk .tip{color:var(--ink);margin-top:6px;font-size:15px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:600}
.hero{border-color:var(--acc);border-width:2px}.big-btn{width:100%;padding:14px;font-weight:600;font-size:18px}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.grow{flex:1;min-width:0}
.dot{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--mute)}.dot.ok{background:var(--ok);border-color:var(--ok);color:var(--card)}.dot.cur{border-color:var(--acc);color:var(--acc)}
button.opt{min-height:52px}button.opt.ok::before{content:"✓ "}button.opt.no::before{content:"✗ "}button.opt.sel{border:2px solid var(--acc)}
#act{position:sticky;bottom:0;background:var(--card);padding:8px 0 2px}button:disabled{opacity:.6;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.bar i{transition:width .3s}@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
details.card summary{cursor:pointer}.x{padding:8px 12px}
.passage{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
</style>
</head>
<body><main id="app"></main>
<script src="content.js"></script>
<script>
const KEY="a1-taeglich-v1", $=s=>document.querySelector(s), app=$("#app");
const dayNum=()=>{const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)};
const INTERVALS=[0,1,2,4,8,16,32]; // days per Leitner box
let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s){if(s.lessons&&s.lessons["01"]&&!s.mig2){s.lessons["05"]=s.lessons["01"];delete s.lessons["01"]}s.mig2=1;if(!s.sessDays)s.sessDays=(s.days||[]).slice();return s}}catch(e){}
  return {cards:{},seen:0,days:[],sessDays:[],sessions:0,notes:{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function say(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=.85;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith("de"));if(v)u.voice=v;speechSynthesis.speak(u)}
function stopAudio(){try{if("speechSynthesis" in window)speechSynthesis.cancel()}catch(e){}}
function armed(b,fn,label){if(b.dataset.arm)return fn();b.dataset.arm=1;const t=b.textContent;b.textContent=label||"Tap again to confirm";setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.textContent=t}},3000)}
function addMistake(q,correct,tag,it){S.mistakes=(S.mistakes||[]).filter(m=>!(m.q===q&&m.correct===correct));S.mistakes.unshift({q,correct,tag,date:dayNum(),it});S.mistakes=S.mistakes.slice(0,60);save()}
function lessonPassed(id){const p=(S.lessons||{})[id];return !!p&&(p.passed||p.best>=70)}
function streak(){let n=0,d=dayNum();if(!S.days.includes(d))d--;while(S.days.includes(d)){n++;d--}return n}

function exportData(){
  const blob=new Blob([JSON.stringify({app:KEY,saved:new Date().toISOString(),data:S})],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="a1-taeglich-backup-"+new Date().toISOString().slice(0,10)+".json";
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  $("#bmsg").textContent="Backup saved to your downloads.";
}
function importData(f){
  if(!f)return;const r=new FileReader();
  r.onload=()=>{try{
    const j=JSON.parse(r.result);
    if(j.app!==KEY||!j.data||typeof j.data.cards!=="object"||!Array.isArray(j.data.days))throw 0;
    S=j.data;save();home();$("#bmsg").textContent="Backup restored: "+S.sessions+" sessions, "+Object.keys(S.cards).length+" words.";
  }catch(e){$("#bmsg").textContent="That file is not an A1 Täglich backup."}};
  r.readAsText(f);
}
// ---- today's plan ----
let plan=null, cur=0, started=0;
const BLOCKS=[
 {name:"Review words",min:5,run:reviewBlock},
 {name:"New words",min:4,run:newWordsBlock},
 {name:"Grammar",min:5,run:grammarBlock},
 {name:"Lesen (reading)",min:4,run:readBlock},
 {name:"Hören (listening)",min:3,run:listenBlock},
 {name:"Alltag (daily life)",min:5,run:alltagBlock},
 {name:"Schreiben / Sprechen",min:4,run:produceBlock}
];
function home(){
  stopAudio();clearTimeout(tick.t);app.className="";
  const d=dayNum(),done=(S.sessDays||[]).includes(d),due=dueCards().length,Ls=CONTENT.lessons,next=Ls.find(l=>!lessonPassed(l.id)),anyPassed=Ls.some(l=>lessonPassed(l.id));
  const rs=S.resume&&Ls.find(l=>l.id===S.resume.id);
  const nm=(S.mistakes||[]).filter(m=>m.it).length,st=streak(),blocks=BLOCKS.map(b=>b.name.replace(/ \(.*/,"")).join(" · ");
  app.innerHTML=`<div class="row space"><h1>A1 Täglich</h1><div class="pill">🔥 ${st} ${st===1?"day":"days"}</div></div>
  ${rs?`<div class="card hero"><div class="mute">You stopped in the middle</div><h2>Lektion ${rs.id} · ${esc(rs.title)}</h2><button class="p big-btn" onclick="startLesson('${rs.id}',true)">Resume at step ${S.resume.k+1}</button></div>`:""}
  ${next&&!rs?`<div class="card hero"><div class="mute">${anyPassed?"Continue your course":"Start here"}</div><h2>Lektion ${next.id} · ${esc(next.title)}</h2><p class="mute">~${next.minutes} min · words, grammar, listening, reading, speaking, test</p><button class="p big-btn" onclick="startLesson('${next.id}')">${S.lessons&&S.lessons[next.id]?"Try again":"Start lesson"}</button></div>`:""}
  <div class="card${next||rs?"":" hero"}"><div class="row space"><h2>Daily training · 30 min</h2><span class="mute">${due} due</span></div><p class="mute">${blocks}</p>
  ${!anyPassed?`<p class="mute">New to German? Do Lektion 01 first. The daily training assumes a few basics.</p>`:""}${done?`<p class="mute">✅ Done today.</p>`:""}
  <button class="${next||rs?"":"p big-btn"}" onclick="start()">${done?"Practise again":"Start daily training"}</button>
  <div class="bar" style="margin-top:12px"><i style="width:${Math.min(100,S.sessions/30*100)}%"></i></div><div class="mute">${S.sessions} of 30 sessions · ${Object.keys(S.cards).length}/${CONTENT.vocab.length} words started</div></div>
  <div class="card"><h2>Lektionen</h2>${Ls.map(l=>{const p=(S.lessons||{})[l.id],ok=lessonPassed(l.id),cur=!rs&&next&&next.id===l.id;return `<div class="lrow"><span class="dot ${ok?"ok":cur?"cur":""}">${ok?"✓":l.id}</span><div class="grow"><b>${esc(l.title)}</b><div class="mute">~${l.minutes} min${p?" · best "+p.best+"%":""}</div></div><button class="${cur?"p":""}" onclick="startLesson('${l.id}')">${p?"Repeat":"Start"}</button></div>`}).join("")}</div>
  <div class="card"><div class="row space"><h2>Mistake bank</h2><span class="mute">${nm} to practise</span></div><p class="mute">Every wrong answer is saved here. Practise them until they are gone.</p>
  <div class="row"><button class="${nm?"p":""}" ${nm?"":"disabled"} onclick="practiseMistakes()">Practise mistakes</button><button onclick="showMistakes()">See list</button></div></div>
  <div class="card"><h2>Extra practice</h2><p class="mute">Optional drills, any time. They use words you have already met.</p>
  <div class="row"><button onclick="extra('write')">Write the word</button><button onclick="extra('hear')">Listen &amp; type</button><button onclick="extra('artikel')">der / die / das</button><button onclick="extra('szene')">Daily scenes</button></div></div>
  <details class="card"><summary><b>More</b> <span class="mute">exam info, backup, reset</span></summary>
  <p><b>Exam</b></p><p class="mute">${CONTENT.examInfo}</p>
  <p><b>Backup</b></p><p class="mute">Your progress lives only on this device. Save a backup file now and then, and import it on a new phone.</p>
  <div class="row"><button onclick="exportData()">Export backup</button><button onclick="document.getElementById('imp').click()">Import backup</button>
  <input id="imp" type="file" accept="application/json,.json" hidden onchange="importData(this.files[0])"></div><p id="bmsg" class="mute"></p>
  <button class="mute" onclick="armed(this,()=>{localStorage.removeItem(KEY);S=load();home()},'Tap again to erase everything')">Reset progress</button></details>`;
}
function start(){cur=0;started=Date.now();S._n={newWords:[]};runBlock()}
function runBlock(){
  if(cur>=BLOCKS.length)return finish();
  const b=BLOCKS[cur];
  stopAudio();app.innerHTML=`<div class="row space mute"><button class="x" onclick="armed(this,home,'Quit session?')">✕</button><span>${cur+1}/${BLOCKS.length} · ${b.name} (~${b.min} min)</span><span id="clk"></span></div>
  <div class="bar"><i style="width:${cur/BLOCKS.length*100}%"></i></div><div id="blk"></div>`;
  tick();b.run($("#blk"),()=>{cur++;runBlock()});
}
function tick(){clearTimeout(tick.t);const c=$("#clk");if(!c)return;
  const s=Math.floor((Date.now()-started)/1000);c.textContent=`⏱ ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;tick.t=setTimeout(tick,1000)}
function finish(){
  const d=dayNum();if(!S.sessDays.includes(d)){S.sessDays.push(d);S.sessions++}if(!S.days.includes(d))S.days.push(d);
  S.seen=Object.keys(S.cards).length;delete S._n;save();clearTimeout(tick.t);
  const m=Math.round((Date.now()-started)/60000);
  app.innerHTML=`<div class="card"><h2>Fertig! 🎉</h2><p>${m} min today · ${streak()} day streak.</p>
  <p class="mute">Tomorrow: your new words come back for review. That repetition is what makes them stick.</p><button class="p" onclick="home()">Home</button></div>`;
}

// ---- vocab / spaced repetition ----
function dueCards(){const d=dayNum();return Object.entries(S.cards).filter(([k,c])=>c.due<=d).map(([k])=>+k)}
function reviewBlock(el,next){
  const q=dueCards().sort(()=>Math.random()-.5).slice(0,15);
  if(!q.length)return next();
  let i=0;(function show(){
    if(i>=q.length){save();return next()}
    const w=CONTENT.vocab[q[i]];
    const rev=i%2===1;
    el.innerHTML=`<div class="card"><div class="mute">${i+1}/${q.length} · ${rev?"Say it in German, then check.":"What does this mean?"}</div><div class="big">${esc(rev?w[1]:w[0])}</div>
    ${rev?"":`<button id="sp">🔊</button>`}<div id="a"></div><button class="p" id="r">Show answer</button></div>`;
    if(!rev)$("#sp").onclick=()=>say(w[0]);
    $("#r").onclick=()=>{$("#a").innerHTML=`<p><b>${esc(rev?w[0]:w[1])}</b></p><p class="mute"><i>${esc(w[2])}</i></p>`;if(rev)say(w[0]);
      $("#r").outerHTML=`<div class="row"><button id="no" class="no">Again</button><button id="yes" class="ok">Got it</button></div>`;
      const grade=ok=>{const c=S.cards[q[i]];c.box=ok?Math.min(c.box+1,INTERVALS.length-1):0;c.due=dayNum()+Math.max(INTERVALS[c.box],ok?1:0);i++;show()};
      $("#yes").onclick=()=>grade(true);$("#no").onclick=()=>grade(false)};
  })();
}
function newWordsBlock(el,next){
  const t=theme(),fresh=[],V=CONTENT.vocab;
  V.forEach((w,i)=>{if(fresh.length<4&&!S.cards[i]&&w[3]===t.id)fresh.push(i)});
  V.forEach((w,i)=>{if(fresh.length<6&&!S.cards[i]&&!w[3])fresh.push(i)});
  V.forEach((w,i)=>{if(fresh.length<6&&!S.cards[i]&&!fresh.includes(i))fresh.push(i)});
  if(!fresh.length){el.innerHTML=`<div class="card"><p>You've started every word. Add more to content.js!</p><button class="p" id="n">Next</button></div>`;$("#n").onclick=next;return}
  let i=0;(function show(){
    if(i>=fresh.length){save();if(fresh.length<3)return next();
      return quiz(el,shuffle(fresh).slice(0,4).map(f=>{const o=shuffle(fresh.filter(x=>x!==f)).slice(0,2);return [`Was bedeutet „${V[f][0]}“?`,[V[f][1],V[o[0]][1],V[o[1]][1]],0]}),next,"Wörter-Check")}
    const w=CONTENT.vocab[fresh[i]];
    el.innerHTML=`<div class="card"><div class="mute">New word ${i+1}/${fresh.length}${w[3]?" · "+esc(THEMES.find(x=>x.id===w[3]).name):""}</div><div class="big">${esc(w[0])}</div><p><b>${esc(w[1])}</b></p>
    <p class="mute"><i>${esc(w[2])}</i></p><div class="row"><button id="s">🔊 Word</button><button id="s2">🔊 Sentence</button></div>
    <p class="mute">Say it aloud 3 times before continuing.</p><button class="p" id="k">Next</button></div>`;
    $("#s").onclick=()=>say(w[0]);$("#s2").onclick=()=>say(w[2]);
    $("#k").onclick=()=>{S.cards[fresh[i]]={box:1,due:dayNum()+1};i++;show()};
  })();
}

// ---- quiz helper ----
function quiz(el,items,next,title,passage){
  let i=0,score=0;(function show(){
    if(i>=items.length){el.innerHTML=`<div class="card"><h2>${score}/${items.length} correct</h2><p class="mute">${score===items.length?"Perfect.":"Re-read the explanation once, then move on."}</p><button class="p" id="n">Next</button></div>`;return void($("#n").onclick=next)}
    const [q,opts,ans,audio]=items[i];
    el.innerHTML=`<div class="card"><div class="mute">${title} · ${i+1}/${items.length}</div>${audio?`<button id="pl">🔊 Play again</button>`:""}${passage?`<div class="passage">${esc(passage)}</div>`:""}<p class="big" style="font-size:20px">${esc(q)}</p><div id="o"></div></div>`;
    if(audio){$("#pl").onclick=()=>say(audio);say(audio)}
    const fixed=opts[0]==="Richtig"||opts[0]==="A"||opts.length<3&&opts.every(x=>x.length<3);
    const order=opts.map((_,j)=>j);if(!fixed)order.sort(()=>Math.random()-.5);
    order.forEach(j=>{const o=opts[j],b=document.createElement("button");b.className="opt";b.textContent=o;b.dataset.j=j;
      b.onclick=()=>{const bs=el.querySelectorAll(".opt");bs.forEach(x=>{x.disabled=true;if(+x.dataset.j===ans)x.classList.add("ok")});
        if(j===ans)score++;else{b.classList.add("no");addMistake(q,opts[ans],"",{t:audio?"listen":"mcq",q,opts,a:ans,ctx:passage||undefined,say:audio||undefined})}
        const f=document.createElement("div");f.className="fbk "+(j===ans?"good":"bad");f.innerHTML=j===ans?"<b>Richtig!</b>":`<b>Not quite.</b> Correct: <b>${esc(opts[ans])}</b>`;$("#o").append(f);
        const n=document.createElement("button");n.className="p";n.textContent="Continue";n.onclick=()=>{i++;show()};$("#o").append(n)};
      $("#o").append(b)});
  })();
}
function grammarBlock(el,next){
  const g=CONTENT.grammar[S.sessions%CONTENT.grammar.length];
  el.innerHTML=`<div class="card"><h2>${g.title}</h2><p>${g.text}</p><button class="p" id="go">Practise</button></div>`;
  $("#go").onclick=()=>quiz(el,g.q,next,g.title);
}
function readBlock(el,next){
  const R=CONTENT.reading,t=R[S.sessions%R.length];
  el.innerHTML=`<div class="card"><h2>Lesen: ${esc(t.title)}</h2><p class="mute">${t.type==="tf"?"Read the text. Mark each statement richtig or falsch.":"Read the texts. Choose the correct answer."} No dictionary: guess unknown words from context, as in the exam.</p><button class="p" id="go">Start</button></div>`;
  $("#go").onclick=()=>quiz(el,t.qs,next,"Lesen",t.text);
}
function listenBlock(el,next){
  const L=CONTENT.listening,n=L.length,start=(S.sessions*3)%n;
  const items=[0,1,2].map(k=>L[(start+k)%n]).map(([t,q,o,a])=>[q,o,a,t]);
  el.innerHTML=`<div class="card"><h2>Hören</h2><p class="mute">Listen first, then answer. In the real exam you hear each text twice. If you hear nothing, your device has no German voice — turn on sound / install a German voice.</p><button class="p" id="go">Start</button></div>`;
  $("#go").onclick=()=>quiz(el,items,next,"Hören");
}
// ---- daily-life exercises ----
const THEMES=CONTENT.themes, theme=()=>THEMES[S.sessions%THEMES.length];
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const norm=t=>t.toLowerCase().trim().replace(/[.!?,;]+$/,"").replace(/\s+/g," ").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");
function pickIdx(n,tid){
  const V=CONTENT.vocab,seen=Object.keys(S.cards).map(Number);
  let a=tid?shuffle(seen.filter(i=>V[i][3]===tid)).slice(0,n):[];
  if(a.length<n)a=a.concat(shuffle(seen.filter(i=>!a.includes(i))).slice(0,n-a.length));
  if(a.length<n)a=a.concat(shuffle(V.map((_,i)=>i).filter(i=>!a.includes(i))).slice(0,n-a.length));
  return a;
}
function articleItems(n){
  const V=CONTENT.vocab,isN=i=>/^(der|die|das) /.test(V[i][0]),seen=Object.keys(S.cards).map(Number).filter(isN);
  let a=shuffle(seen).slice(0,n);
  if(a.length<n)a=a.concat(shuffle(V.map((_,i)=>i).filter(i=>isN(i)&&!a.includes(i))).slice(0,n-a.length));
  return a.map(i=>{const [art,...rest]=V[i][0].split(" ");return [`___ ${rest.join(" ")}  (${V[i][1]})`,["der","die","das"],["der","die","das"].indexOf(art)]});
}
function sceneItems(d){return d.steps.map(([q,o])=>{const s=shuffle(o.map((t,j)=>[t,j===0]));return [q,s.map(x=>x[0]),s.findIndex(x=>x[1]),q]})}
function typeEx(el,idxs,next,title,hear){
  let i=0,score=0;(function show(){
    if(i>=idxs.length){el.innerHTML=`<div class="card"><h2>${score}/${idxs.length} correct</h2><p class="mute">${score===idxs.length?"Perfekt.":"Wrong words come back sooner in your reviews."}</p><button class="p" id="n">Next</button></div>`;return void($("#n").onclick=next)}
    const w=CONTENT.vocab[idxs[i]];
    el.innerHTML=`<div class="card"><div class="mute">${title} · ${i+1}/${idxs.length}</div>
    <p class="mute">${hear?"Listen and type what you hear (with der/die/das for nouns).":"Write it in German (with der/die/das for nouns)."}</p>
    ${hear?`<button id="pl">🔊 Play again</button>`:`<div class="big">${esc(w[1])}</div>`}
    <input id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:100%;font:inherit;padding:10px;margin:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)">
    <div class="row">${["ä","ö","ü","ß"].map(c=>`<button type="button" class="um">${c}</button>`).join("")}</div><div id="fb" style="margin:10px 0"></div><button class="p" id="ck">Check</button></div>`;
    const inp=$("#ti");inp.focus();
    if(hear){$("#pl").onclick=()=>say(w[0]);say(w[0])}

    <div class="row" style="margin:10px 0">${SR?`<button id="mic">🎤 Sprechen</button>`:""}<button class="p" id="sd">Senden</button></div><div id="fb"></div></div>`;
    say(st.spoken||st.q);$("#rp").onclick=()=>say(st.spoken||st.q);
    if(SR)$("#mic").onclick=()=>{const bad=()=>{$("#fb").innerHTML=`<span class="mute">Mikrofon nicht verfügbar. Bitte tippe deine Antwort.</span>`};try{stopAudio();const r=new SR();r.lang="de-DE";r.interimResults=false;r.onresult=e=>{$("#ti").value=e.results[0][0].transcript};r.onerror=bad;r.start()}catch(e){bad()}};
    const send=()=>{
      const v=$("#ti").value.trim();if(!v)return;
      const ok=new RegExp(st.re).test(norm(v));
      if(!tried){rec(st.tag,ok,"Sprechen: "+st.q,v,st.model,{t:"free",tag:st.tag,q:st.q,re:st.re,model:st.model});tried=true}
      if(ok){$("#fb").innerHTML=`<div class="fbk good"><b>Super!</b> ${esc(v)}</div><button class="p big-btn" id="nx">Weiter</button>`;$("#nx").onclick=()=>{i++;show()}}
      else{$("#fb").innerHTML=`<div class="fbk bad"><b>Fast.</b> ${esc(st.tip)}<div class="tip">Beispiel: <b>${esc(st.model)}</b> <button id="ms" aria-label="Beispiel hören">🔊</button></div></div><div class="row"><button class="p" id="rt">Nochmal versuchen</button><button id="nx">Weiter</button></div>`;
        $("#ms").onclick=()=>say(st.model);$("#rt").onclick=()=>{$("#ti").value="";$("#ti").focus();$("#fb").innerHTML=""};$("#nx").onclick=()=>{i++;show()}}
    };
    $("#sd").onclick=send;$("#ti").onkeydown=e=>{if(e.key==="Enter")send()};
  })();
}
function lsFeedback(el){
  const L=LR.L,log=LR.log,tags={},TI=Object.assign({},CONTENT.tagInfoCommon||{},L.tagInfo);
  log.forEach(x=>{(tags[x.tag]=tags[x.tag]||{n:0,ok:0});tags[x.tag].n++;if(x.ok)tags[x.tag].ok++});
  const total=log.length,right=log.filter(x=>x.ok).length,pct=Math.round(right/total*100);
  const tn=LR.test.length,tr=LR.test.filter(Boolean).length,pass=tr>=4&&pct>=70;
  const arr=Object.entries(tags).map(([t,v])=>({t,p:Math.round(v.ok/v.n*100),...v})).sort((a,b)=>a.p-b.p);
  const weak=arr.filter(x=>x.p<80),strong=arr.filter(x=>x.p>=80);
  delete S.resume;S.lessons=S.lessons||{};const prev=S.lessons[L.id],d=dayNum();
  S.lessons[L.id]={best:Math.max(pct,prev?prev.best:0),last:pct,date:d,passed:pass||lessonPassed(L.id)};
  if(!S.days.includes(d))S.days.push(d);save();
  const miss=log.filter(x=>!x.ok),Ls=CONTENT.lessons,nxt=Ls[Ls.findIndex(l=>l.id===L.id)+1];
  el.innerHTML=`<div class="card hero"><h2>${pass?"Bestanden! 🎉":"Noch nicht ganz."}</h2><p>Mini-Test: <b>${tr}/${tn}</b> · Gesamt: <b>${pct}%</b>${prev?` <span class="mute">(vorher: ${prev.last}%)</span>`:""}</p>
  <p class="mute">${pass?"Gut gemacht! Die Wörter kommen morgen im täglichen Training wieder.":"Übe zuerst deine Fehler. Wiederhole die Lektion dann morgen. Ziel: mindestens 4/5 im Test."}</p>
  ${miss.length?`<button class="p big-btn" onclick="practiseMistakes()">Fehler jetzt üben (${Math.min(miss.length,10)})</button>`:pass&&nxt?`<button class="p big-btn" onclick="startLesson('${nxt.id}')">Nächste Lektion: ${esc(nxt.title)}</button>`:`<button class="p big-btn" onclick="home()">Fertig</button>`}</div>
  <div class="card"><h2>Dein Feedback</h2>
  ${arr.map(x=>`<div style="margin:8px 0"><div class="row space"><span>${esc(TI[x.t].name)}</span><span class="mute">${x.ok}/${x.n}</span></div><div class="bar"><i style="width:${x.p}%"></i></div></div>`).join("")}
  ${strong.length?`<p><b>Stark:</b> ${strong.map(x=>esc(TI[x.t].name)).join(", ")}.</p>`:""}
  ${weak.length?`<p><b>Üben:</b></p>${weak.map(x=>`<p>• <b>${esc(TI[x.t].name)}:</b> ${esc(TI[x.t].tip)}</p>`).join("")}`:`<p>Keine Schwächen gefunden. Weiter so!</p>`}</div>
  ${miss.length?`<div class="card"><h2>Deine Fehler</h2>${miss.map(x=>`<p class="mute">${esc(x.q)}<br>Du: ${esc(x.given)} → Richtig: <b>${esc(x.correct)}</b></p>`).join("")}</div>`:""}
  ${L.review?`<div class="card"><h2>Wiederholung</h2><p>${esc(L.review)}</p></div>`:""}
  <div class="row"><button onclick="home()">Home</button><button onclick="startLesson('${L.id}')">Lektion wiederholen</button>${pass&&nxt&&miss.length?`<button onclick="startLesson('${nxt.id}')">Nächste Lektion</button>`:""}</div>`;
}
if("speechSynthesis" in window)speechSynthesis.getVoices();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
home();
</script>
